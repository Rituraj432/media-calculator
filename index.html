 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Cartoon Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f5ff">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; font-weight: 800; }
  
  body { 
    background: linear-gradient(45deg, #050505, #1a0033, #001a33, #050505);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    display: flex; justify-content: center; align-items: center; 
    min-height: 100vh; padding: 40px 20px; overflow-y:auto; position: relative; touch-action: manipulation; 
  }
  @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

  .calc-container { position: relative; z-index: 10; width: 100%; max-width: 380px; margin: auto; }
  
  .calc { 
    width: 100%; background: rgba(15, 15, 15, 0.85); 
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 40px; padding: 25px; 
    box-shadow: 0 0 40px rgba(0, 245, 255, 0.4), 0 0 80px rgba(161, 0, 255, 0.3), inset 0 0 20px rgba(0, 245, 255, 0.1); 
    border: 2px solid rgba(0, 245, 255, 0.3); 
    z-index: 2; position: relative; 
    animation: neonPulse 3s infinite alternate;
  }
  @keyframes neonPulse { from { box-shadow: 0 0 30px #00f5ff, 0 0 60px #a100ff; } to { box-shadow: 0 0 50px #00f5ff, 0 0 90px #ff00ff; border-color: rgba(255, 0, 255, 0.5); } }

  .display { 
    background: #000; border: 2px solid #00f5ff; border-radius: 25px; padding: 20px; 
    height: 125px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; 
    overflow: hidden; margin-bottom: 25px;
    box-shadow: inset 0 0 25px rgba(0, 245, 255, 0.3), 0 0 15px rgba(0, 245, 255, 0.5);
  }
  .history { color: #ff00ff; font-size: 16px; opacity: 0.9; height: 22px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 0 10px #ff00ff; }
  .result { color: #00f5ff; font-size: 48px; line-height: 1.1; width: 100%; text-align: right; word-break: break-all; max-height: 60px; overflow: hidden; text-shadow: 0 0 20px #00f5ff, 0 0 40px #00f5ff; transition: all 0.2s; }
  .result.small { font-size: 32px; }
  .result.xsmall { font-size: 22px; }

  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
  button { 
    height: 70px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 22px; 
    background: linear-gradient(145deg, #222, #111); 
    color: #00f5ff; font-size: 28px; cursor: pointer; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    user-select: none; -webkit-tap-highlight-color: transparent; 
    box-shadow: 5px 5px 15px rgba(0,0,0,0.6), -5px -5px 15px rgba(255,255,255,0.05);
  }
  button:active { transform: scale(0.85); box-shadow: 0 0 25px #00f5ff, inset 0 0 15px #00f5ff; background: #00f5ff; color: #000; }
  
  .op { background: linear-gradient(145deg, #330033, #1a001a); color: #ff00ff; border-color: rgba(255, 0, 255, 0.3); }
  .op:active { background: #ff00ff; color: #fff; box-shadow: 0 0 25px #ff00ff; }
  
  .equal { background: linear-gradient(135deg, #00f5ff, #a100ff, #ff00ff); background-size: 200% 200%; color: #fff; font-size: 35px; animation: gradientBG 3s ease infinite; box-shadow: 0 0 20px rgba(161, 0, 255, 0.6); border: none; }
  .equal:active { transform: scale(0.85); box-shadow: 0 0 40px #fff; }
  .zero { grid-column: span 2; border-radius: 22px; }

  /* कार्टून्स */
  .cartoon { position: absolute; pointer-events: none; z-index: 5; font-size: 55px; filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.8)); animation: floatHeavy 4s ease-in-out infinite; }
  .ufo { top: -35px; left: -15px; }
  .planet { bottom: -30px; right: -15px; animation-delay: 1.5s; font-size: 50px; }
  .astro { top: -35px; right: -15px; animation-delay: 0.7s; }
  .rocket { bottom: -30px; left: -15px; animation-delay: 2.2s; font-size: 45px; transform: rotate(45deg); filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.8)); }
  @keyframes floatHeavy { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-18px) rotate(5deg); } 100% { transform: translateY(0px) rotate(0deg); } }

  /* कनवर्टर का नया डिज़ाइन */
  .toggle-btn { margin-top: 20px; background: rgba(15,15,15,0.8); border: 2px solid #a100ff; color: #ff00ff; width: 100%; border-radius: 20px; height: 50px; font-size: 18px; box-shadow: 0 0 15px rgba(161,0,255,0.3); }
  .toggle-btn:active { background: #ff00ff; color: #fff; box-shadow: 0 0 25px #ff00ff; }
  
  .converter-box { display: none; margin-top: 15px; background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); border-radius: 25px; padding: 20px; border: 2px solid #00f5ff; box-shadow: 0 0 20px rgba(0, 245, 255, 0.3); text-align: center; position: relative; z-index: 2; }
  .converter-box.active { display: block; animation: neonPulse 3s infinite alternate; }
  .conv-select, .conv-input { width: 100%; background: #050505; color: #00f5ff; border: 1px solid #00f5ff; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 16px; outline: none; font-weight: bold; }
  .conv-select:focus, .conv-input:focus { box-shadow: 0 0 10px #00f5ff; }
  .conv-result { font-size: 35px; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; margin-top: 10px; word-break: break-all; min-height: 45px; }
</style>
</head>
<body>
<div class="calc-container">
  <div class="cartoon ufo">🛸</div><div class="cartoon astro">👨‍🚀</div><div class="cartoon rocket">🚀</div><div class="cartoon planet">🌙</div>
  
  <div class="calc">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button onclick="clearAll()" style="color: #ff3333;">AC</button>
      <button onclick="back()" style="color: #ffaa00;">DEL</button>
      <button class="op" onclick="press('%')">%</button>
      <button class="op" onclick="press('/')">÷</button>
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="op" onclick="press('*')">×</button>
      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button class="op" onclick="press('-')">−</button>
      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="op" onclick="press('+')">+</button>
      <button class="zero" onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- यूनिट कनवर्टर सेक्शन -->
  <button class="toggle-btn" onclick="toggleConverter()">💱 Unit Converter</button>
  <div class="converter-box" id="converterBox">
    <select class="conv-select" id="convCategory" onchange="updateUnits()">
      <option value="length">📏 Length (लंबाई)</option>
      <option value="mass">⚖️ Mass (वजन)</option>
      <option value="volume">☕ Volume (आयतन)</option>
      <option value="speed">🚀 Speed (गति)</option>
      <option value="area">📐 Area (क्षेत्रफल)</option>
      <option value="temperature">🌡️ Temperature (तापमान)</option>
    </select>
    <input type="number" class="conv-input" id="convInput" value="1" oninput="doConvert()" placeholder="Value">
    <select class="conv-select" id="convFrom" onchange="doConvert()"></select>
    <select class="conv-select" id="convTo" onchange="doConvert()"></select>
    <div class="conv-result" id="convResult">0</div>
  </div>

</div>

<script>
// --- कैलकुलेटर का लॉजिक ---
let current = '0'; 
let justCalculated = false;
const resultEl = document.getElementById('result'); 
const historyEl = document.getElementById('history');
const ops = ['+', '-', '*', '/'];

function updateDisplay() { 
  let d = current; 
  resultEl.textContent = d.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−'); 
  resultEl.classList.remove('small','xsmall'); 
  if (d.length > 8) resultEl.classList.add('small'); 
  if (d.length > 14) resultEl.classList.add('xsmall'); 
}

function press(val) { 
  if (justCalculated) { 
    if (ops.includes(val)) { justCalculated = false; } 
    else if (val !== '%') { current = '0'; historyEl.textContent = ''; justCalculated = false; } 
  } 
  
  let lastChar = current.slice(-1);
  if (ops.includes(val) && ops.includes(lastChar)) { current = current.slice(0, -1) + val; }
  else if (current === '0' && !ops.includes(val) && val !== '.' && val !== '%') { current = val; } 
  else if (val === '.') {
    let parts = current.split(/[\+\-\*\/]/);
    if (!parts[parts.length - 1].includes('.')) { current += val; }
  } 
  else { current += val; }
  
  if (navigator.vibrate) { navigator.vibrate(20); }
  updateDisplay(); 
}

function clearAll() { 
  current = '0'; historyEl.textContent = ''; justCalculated = false; updateDisplay(); 
  if (navigator.vibrate) { navigator.vibrate(40); }
}

function back() { 
  if (justCalculated) { clearAll(); return; } 
  if (current === 'Error' || current === 'Infinity' || current === '-Infinity' || current === 'NaN') { clearAll(); return; }
  current = current.slice(0, -1) || '0'; 
  updateDisplay(); 
}

function calculate() { 
  try { 
    if (ops.includes(current.slice(-1))) { current = current.slice(0, -1); }
    let original = current;
    let exp = current; 
    
    exp = exp.replace(/(\d+\.?\d*)([\+\-])(\d+\.?\d*)%/g, '($1$2($1*$3/100))');
    exp = exp.replace(/(\d+\.?\d*)%/g, '($1/100)');
    
    let res = eval(exp); 
    
    if (res === Infinity || res === -Infinity) { current = 'Infinity'; } 
    else if (isNaN(res)) { current = 'Error'; } 
    else { current = String(parseFloat(res.toFixed(10))); }
    
    historyEl.textContent = original.replace(/\*/g, '×').replace(/\//g, '÷') + ' ='; 
    justCalculated = true; 
    if (navigator.vibrate) { navigator.vibrate([30, 50, 30]); }
    updateDisplay(); 
  } catch(e) { 
    current = 'Error'; updateDisplay(); setTimeout(clearAll, 1200); 
  } 
}
updateDisplay();

// --- कनवर्टर का लॉजिक ---
const unitData = {
  length: { meter: 1, kilometer: 0.001, centimeter: 100, millimeter: 1000, mile: 0.000621371, inch: 39.3701 },
  mass: { kilogram: 1, gram: 1000, milligram: 1000000, pound: 2.20462, ounce: 35.274 },
  volume: { liter: 1, milliliter: 1000, gallon_us: 0.264172, cup: 4.16667 },
  speed: { meter_per_second: 1, kilometer_per_hour: 3.6, mile_per_hour: 2.23694 },
  area: { square_meter: 1, square_kilometer: 0.000001, square_foot: 10.7639, acre: 0.000247105 },
  temperature: { celsius: 'Celsius', fahrenheit: 'Fahrenheit', kelvin: 'Kelvin' }
};

function toggleConverter() {
  const box = document.getElementById('converterBox');
  box.classList.toggle('active');
  if(box.classList.contains('active')) updateUnits();
}

function updateUnits() {
  const cat = document.getElementById('convCategory').value;
  const fromSel = document.getElementById('convFrom');
  const toSel = document.getElementById('convTo');
  fromSel.innerHTML = ''; toSel.innerHTML = '';
  
  for(let unit in unitData[cat]) {
    let cleanName = unit.replace(/_/g, ' ').toUpperCase();
    fromSel.add(new Option(cleanName, unit));
    toSel.add(new Option(cleanName, unit));
  }
  toSel.selectedIndex = 1 < toSel.options.length ? 1 : 0;
  doConvert();
}

function doConvert() {
  const cat = document.getElementById('convCategory').value;
  const val = parseFloat(document.getElementById('convInput').value);
  const from = document.getElementById('convFrom').value;
  const to = document.getElementById('convTo').value;
  const resEl = document.getElementById('convResult');

  if(isNaN(val)) { resEl.textContent = '0'; return; }

  if(cat === 'temperature') {
    let c;
    if(from === 'celsius') c = val;
    else if(from === 'fahrenheit') c = (val - 32) * 5/9;
    else if(from === 'kelvin') c = val - 273.15;

    let out;
    if(to === 'celsius') out = c;
    else if(to === 'fahrenheit') out = (c * 9/5) + 32;
    else if(to === 'kelvin') out = c + 273.15;
    resEl.textContent = parseFloat(out.toFixed(4));
  } else {
    let base = val / unitData[cat][from];
    let out = base * unitData[cat][to];
    resEl.textContent = parseFloat(out.toFixed(4));
  }
}
</script>

<script>
// PWA सर्विस वर्कर
if ('serviceWorker' in navigator) { 
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./pwabuilder-sw.js').then(() => {
      console.log("Service Worker Registered - Heavy Offline Mode Ready");
    }).catch((err) => {
      console.log("Service Worker Failed: ", err);
    });
  });
}
</script>
</body>
</html>
