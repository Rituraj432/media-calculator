<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Cartoon Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Baloo 2', cursive; }
  body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; overflow: hidden; position: relative; }
  .calc-container { position: relative; z-index: 10; }
  .calc { width: 100%; min-width: 320px; max-width: 360px; background: #111; border-radius: 40px; padding: 20px; box-shadow: 0 0 30px #00f5ff, 0 0 60px #a100ff; border: 2px solid #222; z-index: 2; }
  .display { background: #000; border: 2px solid #00f5ff; border-radius: 25px; padding: 18px 15px; min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; overflow: hidden; margin-bottom: 18px; }
  .history { color: #ff00ff; font-size: 14px; opacity: 0.8; min-height: 18px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  
  /* Fixed: Replaced nowrap with word-break to prevent '...' cutoff */
  .result { color: #00f5ff; font-size: 42px; font-weight: 600; line-height: 1.1; width: 100%; text-align: right; word-break: break-all; transition: font-size 0.2s; }
  
  .result.small { font-size: 28px; }
  .result.xsmall { font-size: 20px; }
  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button { height: 65px; border: none; border-radius: 18px; background: #1e1e1e; color: #00f5ff; font-size: 24px; cursor: pointer; transition: 0.15s; }
  button:active { transform: scale(0.92); box-shadow: 0 0 15px #00f5ff; }
  .op { background: #2a0a2a; color: #ff00ff; }
  .equal { background: linear-gradient(135deg,#00f5ff,#a100ff); color: #000; font-weight: bold; }
  .zero { grid-column: span 2; }
  .cartoon { position: absolute; pointer-events: none; z-index: 5; font-size: 50px; filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.6)); animation: float 4s ease-in-out infinite; }
  .ufo { top: -30px; left: -25px; }
  .planet { bottom: -20px; right: -15px; animation-delay: 1.5s; }
  .astro { top: 40%; right: -30px; animation-delay: 0.7s; font-size: 40px;}
  @keyframes float { 0% { transform: translateY(0px) } 50% { transform: translateY(-12px) } 100% { transform: translateY(0px) } }
</style>
</head>
<body>
<div class="calc-container">
  <div class="cartoon ufo">🛸</div>
  <div class="cartoon planet">🪐</div>
  <div class="cartoon astro">👨‍🚀</div>
  <div class="calc">
    <div class="display"><div class="history" id="history"></div><div class="result" id="result">0</div></div>
    <div class="buttons">
      <button onclick="clearAll()">AC</button><button onclick="back()">⌫</button><button class="op" onclick="press('%')">%</button><button class="op" onclick="press('/')">÷</button>
      <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('*')">×</button>
      <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('-')">−</button>
      <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button>
      <button class="zero" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="equal" onclick="calculate()">=</button>
    </div>
  </div>
</div>
<script>
let current='0';let justCalculated=false;
const resultEl=document.getElementById('result');const historyEl=document.getElementById('history');

function updateDisplay(){
  let display=current;
  // Fixed: Restored auto-formatting for very large numbers
  if (!isNaN(Number(display)) && display.length > 12) {
    let num = Number(display);
    display = (Math.abs(num) < 1 && num !== 0) ? num.toPrecision(8) : num.toExponential(6);
  }
  resultEl.textContent=display;
  resultEl.classList.remove('small','xsmall');
  if(display.length>9)resultEl.classList.add('small');
  if(display.length>14)resultEl.classList.add('xsmall');
}

function press(val){
  const opKeys=['+','-','*','/'];const displayMap={'*':'×','/':'÷','-':'−','+':'+'};const visualOps=['+','−','×','÷'];const displayVal=displayMap[val]||val;
  if(justCalculated){if(opKeys.includes(val)){justCalculated=false;}else if(val!=='%'){current='0';historyEl.textContent='';justCalculated=false;}}
  if(val==='%'){
    try{
      const marksRegex=/^(\d+(?:\.\d+)?)÷(\d+(?:\.\d+)?)$/;const match=current.match(marksRegex);
      if(match){
        let obtained=parseFloat(match[1]);let total=parseFloat(match[2]);
        if(total!==0){let ans=(obtained/total)*100;historyEl.textContent=current+' % =';current=parseFloat(ans.toFixed(4)).toString();justCalculated=true;}
      }else{
        let exp=current.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
        if(opKeys.includes(exp.slice(-1)))exp=exp.slice(0,-1);
        let ans=Function('"use strict";return ('+exp+')')();current=(ans/100).toString();
      }
    }catch{current='Error';setTimeout(clearAll,1200);}
  }
  else if(opKeys.includes(val)){
    let lastChar=current.slice(-1);
    if(visualOps.includes(lastChar)){current=current.slice(0,-1)+displayVal;}
    else if(current.length<24){current+=displayVal;}
  }
  else if(val==='.'){let parts=current.split(/[\+\−\×\÷]/);if(!parts[parts.length-1].includes('.'))current+='.';}
  else{if(current==='0')current=displayVal;else if(current.length<24)current+=displayVal;}
  updateDisplay();
}

function clearAll(){current='0';justCalculated=false;historyEl.textContent='';updateDisplay();}
function back(){if(justCalculated){historyEl.textContent='';justCalculated=false;}current=current.slice(0,-1);if(current===''||current==='−')current='0';updateDisplay();}
function calculate(){
  try{
    let evalStr=current;const visualOps=['+','−','×','÷'];
    if(visualOps.includes(evalStr.slice(-1))){evalStr=evalStr.slice(0,-1);}
    historyEl.textContent=current+' =';
    let exp=evalStr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    let ans=Function('"use strict";return ('+exp+')')();
    if(!isFinite(ans))throw 'error';
    current=parseFloat(ans.toFixed(10)).toString();justCalculated=true;updateDisplay();
  }catch{current='Error';updateDisplay();setTimeout(clearAll,1200);}
}
updateDisplay();
</script>
</body>
</html>
