<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Cartoon Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f5ff">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; font-weight: 600; }
  body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow: hidden; position: relative; touch-action: manipulation; }
  .calc-container { position: relative; z-index: 10; width: 100%; max-width: 360px; margin: auto; }
  .calc { width: 100%; background: #111; border-radius: 40px; padding: 20px; box-shadow: 0 0 30px #00f5ff, 0 0 60px #a100ff; border: 2px solid #222; z-index: 2; position: relative; }
  .display { background: #000; border: 2px solid #00f5ff; border-radius: 25px; padding: 15px; height: 115px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; overflow: hidden; margin-bottom: 18px; }
  .history { color: #ff00ff; font-size: 14px; opacity: 0.8; height: 20px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .result { color: #00f5ff; font-size: 42px; font-weight: 600; line-height: 1.1; width: 100%; text-align: right; word-break: break-all; max-height: 60px; overflow: hidden; }
  .result.small { font-size: 28px; }
  .result.xsmall { font-size: 20px; }
  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button { height: 65px; border: none; border-radius: 18px; background: #1e1e1e; color: #00f5ff; font-size: 24px; cursor: pointer; transition: 0.15s; user-select: none; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(0.92); box-shadow: 0 0 15px #00f5ff; }
  .op { background: #2a0a2a; color: #ff00ff; }
  .equal { background: linear-gradient(135deg,#00f5ff,#a100ff); color: #000; font-weight: bold; }
  .zero { grid-column: span 2; }
  
  /* Cartoon Emojis Animations */
  .cartoon { position: absolute; pointer-events: none; z-index: 5; font-size: 45px; filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.6)); animation: float 4s ease-in-out infinite; }
  .ufo { top: -35px; left: 0px; }
  .planet { bottom: -35px; right: 0px; animation-delay: 1.5s; }
  .astro { top: -35px; right: 0px; animation-delay: 0.7s; }
  .rocket { bottom: -35px; left: 0px; animation-delay: 2.2s; font-size: 40px; transform: rotate(45deg); }
  @keyframes float { 0% { transform: translateY(0px) } 50% { transform: translateY(-12px) } 100% { transform: translateY(0px) } }
</style>
</head>
<body>
<div class="calc-container">
  <div class="cartoon ufo">🛸</div><div class="cartoon astro">👨‍🚀</div><div class="cartoon rocket">🚀</div><div class="cartoon planet">🌙</div>
  <div class="calc">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button onclick="clearAll()">AC</button><button onclick="back()">DEL</button><button class="op" onclick="press('%')">%</button><button class="op" onclick="press('/')">÷</button>
      <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('*')">×</button>
      <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('-')">−</button>
      <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button>
      <button class="zero" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="equal" onclick="calculate()">=</button>
    </div>
  </div>
</div>
<script>
let current = '0'; 
let justCalculated = false;
const resultEl = document.getElementById('result'); 
const historyEl = document.getElementById('history');
const ops = ['+', '-', '*', '/'];

function updateDisplay() { 
  let d = current; 
  if (!isNaN(Number(d)) && d.length > 12 && d !== 'Infinity') { 
    let n = Number(d); 
    d = (Math.abs(n) < 1 && n !== 0) ? n.toPrecision(8) : n.toExponential(6); 
  } 
  resultEl.textContent = d.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−'); 
  resultEl.classList.remove('small','xsmall'); 
  if (d.length > 9) resultEl.classList.add('small'); 
  if (d.length > 14) resultEl.classList.add('xsmall'); 
}

function press(val) { 
  if (justCalculated) { 
    if (ops.includes(val)) { justCalculated = false; } 
    else if (val !== '%') { current = '0'; historyEl.textContent = ''; justCalculated = false; } 
  } 
  
  let lastChar = current.slice(-1);
  
  // ऑपरेटर रिप्लेसमेंट (ताकि ++ या ** जैसी गलती न हो)
  if (ops.includes(val) && ops.includes(lastChar)) {
    current = current.slice(0, -1) + val;
  }
  else if (current === '0' && !ops.includes(val) && val !== '.' && val !== '%') {
    current = val;
  } 
  else if (val === '.' && current.includes('.')) {
    // दशमलव (.) को चेक करना
    let parts = current.split(/[\+\-\*\/]/);
    if (!parts[parts.length - 1].includes('.')) { current += val; }
  } 
  else { current += val; }
  
  updateDisplay(); 
}

function clearAll() { 
  current = '0'; historyEl.textContent = ''; justCalculated = false; updateDisplay(); 
}

function back() { 
  if (justCalculated) { clearAll(); return; } 
  current = current.slice(0, -1) || '0'; 
  updateDisplay(); 
}

function calculate() { 
  try { 
    // अगर आखिरी कैरेक्टर कोई ऑपरेटर है, तो उसे हटा दें (जैसे 5+ को 5 मान ले)
    if (ops.includes(current.slice(-1))) { current = current.slice(0, -1); }
    
    let exp = current; 
    if (exp.includes('%')) { exp = exp.replace(/(\d+\.?\d*)%/g, (_,n) => `(${n}/100)`); } 
    
    let res = eval(exp); 
    
    // Infinity (Zero Division) हैंडलिंग
    if (res === Infinity || res === -Infinity) {
      current = 'Infinity';
    } else {
      // फ्लोटिंग पॉइंट एरर फिक्स (जैसे 0.1 + 0.2 = 0.30000000000000004)
      current = String(parseFloat(res.toFixed(10))); 
    }
    
    historyEl.textContent = current === 'Infinity' ? current : exp.replace(/\*/g, '×').replace(/\//g, '÷') + ' ='; 
    justCalculated = true; 
    updateDisplay(); 
  } catch(e) { 
    current = 'Error'; updateDisplay(); setTimeout(clearAll, 1200); 
  } 
}

updateDisplay();
</script>
<script>
if ('serviceWorker' in navigator) { 
  navigator.serviceWorker.register('./pwabuilder-sw.js').then(() => {
    console.log("Service Worker Registered");
  }); 
}
</script>
</body>
</html>
